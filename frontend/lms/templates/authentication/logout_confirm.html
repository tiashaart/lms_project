{% extends 'base.html' %}
{% block title %}Logout | Hope Academy{% endblock %}

{% block content %}
<div class="auth-card text-center">
  <i class="fa-solid fa-right-from-bracket fa-3x text-muted mb-3"></i>
  <h2 class="section-title">Log out?</h2>
  <p class="text-muted mb-4">Are you sure you want to log out of Hope Academy?</p>
  <form method="post" class="d-flex gap-2 justify-content-center">
    {% csrf_token %}
    <a href="{% url 'core:dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
    <button type="submit" class="btn btn-primary">Log Out</button>
  </form>
</div>
{% endblock %}
