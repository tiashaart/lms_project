{% extends 'base.html' %}
{% block title %}Forgot Password | Hope Academy{% endblock %}

{% block content %}
<div class="auth-card">
  <h2 class="section-title text-center">Forgot password?</h2>
  <p class="text-muted text-center mb-4">Enter your email and we'll send a reset link.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="email">Email Address</label>
      <input type="email" class="form-control" id="email" name="email" required />
    </div>
    <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
  </form>
  <p class="text-center mt-3"><a href="{% url 'core:login' %}">Back to login</a></p>
</div>
{% endblock %}
