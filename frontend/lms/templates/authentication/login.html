{% extends 'base.html' %}
{% block title %}Login | Hope Academy{% endblock %}

{% block content %}
<div class="auth-card">
  <h2 class="section-title text-center">Welcome back</h2>
  <p class="text-muted text-center mb-4">Sign in to continue your learning journey.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="username">Username or Email</label>
      <input type="text" class="form-control" id="username" name="username" required />
    </div>
    <div class="mb-3 password-toggle">
      <label class="form-label" for="password">Password</label>
      <input type="password" class="form-control" id="password" name="password" required />
      <button type="button" class="toggle-btn" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
    </div>
    <div class="mb-3">
      <label class="form-label" for="role">Demo Role</label>
      <select class="form-select" id="role" name="role">
        <option value="student">Student</option>
        <option value="instructor">Instructor</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="remember" name="remember" />
        <label class="form-check-label" for="remember">Remember me</label>
      </div>
      <a href="{% url 'core:forgot_password' %}">Forgot password?</a>
    </div>
    <button type="submit" class="btn btn-primary w-100">Login</button>
  </form>
  <p class="text-center mt-3">New here? <a href="{% url 'core:register' %}">Create an account</a></p>
</div>
{% endblock %}
