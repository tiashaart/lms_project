{% extends 'base.html' %}
{% block title %}Change Password | Hope Academy{% endblock %}

{% block content %}
<div class="auth-card">
  <h2 class="section-title text-center">Change Password</h2>
  <p class="text-muted text-center mb-4">Update your account password.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3 password-toggle">
      <label class="form-label" for="current_password">Current Password</label>
      <input type="password" class="form-control" id="current_password" name="current_password" required />
      <button type="button" class="toggle-btn" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
    </div>
    <div class="mb-3 password-toggle">
      <label class="form-label" for="password">New Password</label>
      <input type="password" class="form-control" id="password" name="password" required minlength="8" />
      <button type="button" class="toggle-btn" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
    </div>
    <div class="mb-3 password-toggle">
      <label class="form-label" for="confirm_password">Confirm New Password</label>
      <input type="password" class="form-control" id="confirm_password" name="confirm_password" required data-match="password" />
      <button type="button" class="toggle-btn" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
    </div>
    <button type="submit" class="btn btn-primary w-100">Update Password</button>
  </form>
</div>
{% endblock %}
