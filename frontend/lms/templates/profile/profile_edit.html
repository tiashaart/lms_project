{% extends 'base.html' %}
{% load static %}
{% block title %}Edit Profile | Hope Academy{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="widget-card">
      <h3 class="section-title mb-4">Edit Profile</h3>
      <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        <div class="text-center mb-4">
          <img src="{% static profile.avatar %}" alt="Profile photo" class="profile-avatar-lg mb-3" id="avatarPreview" />
          <div>
            <label class="btn btn-outline-primary btn-sm" for="avatar">Change Photo</label>
            <input type="file" class="d-none" id="avatar" name="avatar" accept="image/*" data-preview="avatarPreview" />
          </div>
        </div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="first_name">First Name</label>
            <input type="text" class="form-control" id="first_name" name="first_name" value="{{ profile.first_name }}" required />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="last_name">Last Name</label>
            <input type="text" class="form-control" id="last_name" name="last_name" value="{{ profile.last_name }}" required />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ profile.email }}" required />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="phone">Phone</label>
            <input type="tel" class="form-control" id="phone" name="phone" value="{{ profile.phone }}" />
          </div>
          <div class="col-12">
            <label class="form-label" for="bio">Bio</label>
            <textarea class="form-control" id="bio" name="bio" rows="4">{{ profile.bio }}</textarea>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="{% url 'core:profile' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
