<div class="empty-state text-center py-5">
  <i class="fa-solid fa-{{ icon|default:'inbox' }} fa-3x text-muted mb-3"></i>
  <h5>{{ title|default:'No results found' }}</h5>
  <p class="text-muted">{{ message|default:'Try adjusting your search or filters.' }}</p>
  {% if action_url %}
  <a href="{{ action_url }}" class="btn btn-primary">{{ action_label|default:'Browse' }}</a>
  {% endif %}
</div>
