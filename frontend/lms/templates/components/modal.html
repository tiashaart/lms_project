<div class="modal fade" id="{{ modal_id|default:'confirmModal' }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title|default:'Confirm' }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>{{ message|default:'Are you sure you want to proceed?' }}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        {% if confirm_url %}
        <a href="{{ confirm_url }}" class="btn btn-primary">{{ confirm_label|default:'Confirm' }}</a>
        {% else %}
        <button type="button" class="btn btn-primary" id="{{ confirm_id|default:'confirmBtn' }}">{{ confirm_label|default:'Confirm' }}</button>
        {% endif %}
      </div>
    </div>
  </div>
</div>
