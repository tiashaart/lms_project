{% load static %}
<nav class="top-navbar">
  <div class="nav-brand">
    <a href="{% url 'core:home' %}" class="brand-link">
      <img src="{% static 'icons/logo.svg' %}" alt="Hope Academy logo" class="brand-logo" />
      <span>Hope Academy</span>
    </a>
    {% if request.user.is_authenticated %}
    <button class="sidebar-toggle-mobile d-lg-none" id="sidebarToggleMobile" type="button" aria-label="Toggle menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    {% endif %}
  </div>
  <div class="nav-actions">
    <form class="search-box" role="search" action="{% url 'core:course_list' %}" method="get">
      <i class="fa-solid fa-search"></i>
      <input type="text" name="q" placeholder="Search courses, lessons..." value="{{ search_query|default:'' }}" />
    </form>
    {% if request.user.is_authenticated %}
      <a href="{% url 'core:notification_list' %}" class="icon-btn" aria-label="Notifications">
        <i class="fa-solid fa-bell"></i>
        {% if unread_count %}<span class="badge" id="navNotifBadge">{{ unread_count }}</span>{% endif %}
      </a>
      <a href="{% url 'core:profile' %}" class="avatar-group">
        <img src="{% static user.avatar %}" alt="{{ user.full_name }}" />
        <div>
          <strong>{{ user.first_name }}</strong>
          <p>{{ user.role|title }}</p>
        </div>
      </a>
    {% else %}
      <a href="{% url 'core:login' %}" class="btn btn-outline-primary">Login</a>
      <a href="{% url 'core:register' %}" class="btn btn-primary">Register</a>
    {% endif %}
  </div>
</nav>
